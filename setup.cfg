[metadata]
name = sphinx_probs_rdf

[bdist_wheel]
universal = 1

[options]
packages=sphinx_probs_rdf
package_dir=
    =src
install_requires =
    sphinx >= 4.0
    rdflib >= 6.2, < 7.0
    pyyaml
include_package_data = 1

[options.extras_require]
loader = myst-parser >= 1.0; markdown-it-py
test = pytest; myst_parser
lint = flake8; mypy
#; docutils-stubs

[pylint.BASIC]
good-names=i,j,k,ex,Run,_,f
